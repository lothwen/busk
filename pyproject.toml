[project]
name = "busk"
version = "0.1.0"
description = "A real-time busking lighting console: show files, fixture import, a DMX engine and its command line"
readme = "README.md"
# PEP 639: the wheel's METADATA carries License-Expression and the file (tests/test_packaging.py).
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel Sánchez", email = "danillo@euskai.org" }
]
# PEP 695 `type` statements and class type parameters need 3.12. The suite passes on 3.12-3.14.
requires-python = ">=3.12"
# Floors: the lowest versions the suite passes with under `uv sync --resolution lowest-direct`
# (phase-8-plan step 11). numpy 2.3.2 is the first with Python 3.14 wheels; on 3.14, pydantic
# before 2.12.4 cannot build the Show validator ("not fully defined").
dependencies = [
    "numpy>=2.3.2",
    "pydantic>=2.12.4",
]

[project.optional-dependencies]
# MIDI surfaces (phase-8-plan §5.7): python-rtmidi needs ALSA to build where no wheel exists.
midi = ["mido>=1.3.0", "python-rtmidi>=1.5.8"]

[project.urls]
Repository = "https://github.com/lothwen/busk"

[project.scripts]
busk = "busk.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# The development setup has every extra: `uv sync` installs the MIDI one too.
dev = [
    "busk[midi]",
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]
# The spec and plans are documents: never reformat their Python snippets.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PT", "RUF"]
# Typographic characters used on purpose in docs and messages (the spec uses them too).
allowed-confusables = ["×", "–", "−"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
# mido ships no type information; it is imported only in busk.io.midi (the `midi` extra).
module = ["mido", "mido.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Benchmarks and the soak are opt-in: `uv run pytest -m perf -s`, `uv run pytest -m soak -s`
# (a later -m overrides this one).
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not perf and not soak"]
markers = [
    "perf: timing benchmarks, excluded from the default run",
    "soak: the one-minute soak (bench/soak.py), excluded from the default run",
    "midi: needs an ALSA sequencer (/dev/snd/seq); skipped without one",
]
xfail_strict = true
